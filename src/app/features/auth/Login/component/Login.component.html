<div class="login-wrap">
  <form class="login-card" [formGroup]="loginForm" (ngSubmit)="onLogin()">
    <h2>Log in</h2>

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email"
           placeholder="you@company.com" autocomplete="email" />


    <!-- <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p> -->

    <label for="role">Role</label>
    <select id="role" formControlName="role">
      <option value="" disabled selected>Select your role...</option>
      <option value="Manager">Manager</option>
      <option value="Employee">Employee</option>
    </select>
    <span class="error-msg" *ngIf="loginForm.get('role')?.touched && loginForm.get('role')?.hasError('required')">
      Role selection is required.
    </span>

    <!-- Submit Button (Disabled if form inputs are invalid or currently loading) -->
    <button type="submit" [disabled]="loading || loginForm.invalid">
      {{ loading ? 'Checking...' : 'Log in' }}
    </button>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </form>
</div>
