<div class="attendance-layout">

  <div class="calendar-wrapper">
    <h2 class="calendar-title">{{ viewDate | date:'MMMM yyyy' }}</h2>

    <mwl-calendar-month-view [viewDate]="viewDate"></mwl-calendar-month-view>
    <!--
      [refresh]="refresh"
      [cellTemplate]="dayCell"
      (beforeViewRender)="onBeforeRender($event)"
    -->
  </div>

  <div class="action-panel">
    <button type="button" class="action-btn btn-login" (click)="login()">Login</button>
    <button type="button" class="action-btn btn-logout" (click)="logout()">Logout</button>
  </div>

</div>
