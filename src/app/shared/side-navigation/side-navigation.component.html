<aside class="side-nav" aria-label="Main navigation">

  <div class="portal-label">
    {{ isManager ? 'Manager portal' : 'Employee portal' }}
  </div>

  <!-- ===== Scrollable middle ===== -->
  <nav class="side-nav__menu">

    <button type="button" class="nav-item" [class.active]="active === 'home'"
            [attr.aria-current]="active === 'home' ? 'page' : null" (click)="Home()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
      </svg>
      <span>Home</span>
    </button>

    <!-- My attendance: visible to everyone -->
    <button type="button" class="nav-item" [class.active]="active === 'attendance'"
            [attr.aria-current]="active === 'attendance' ? 'page' : null" (click)="MyAttendance()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4.5" width="18" height="16" rx="3"/>
        <path d="M3 9.5h18M8 3v3M16 3v3M8.5 15l2.5 2.5 4.5-5"/>
      </svg>
      <span>Attendance</span>
    </button>

    <!-- Employee dropdown: manager only -->
    <ng-container *ngIf="isManager">
      <button type="button" class="nav-item nav-item--parent"
              [class.open]="employeeBlockOpen"
              [attr.aria-expanded]="employeeBlockOpen"
              aria-controls="employee-submenu"
              (click)="toggleEmployee()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="8" r="3.5"/>
          <path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 5.5a3.5 3.5 0 0 1 0 6.5M18 14.3c2 .7 3.5 2.6 3.5 5.7"/>
        </svg>
        <span>Employee</span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>

      <div id="employee-submenu" class="submenu" *ngIf="employeeBlockOpen">
        <button type="button" class="nav-item nav-item--sub"
                [class.active]="active === 'emp-attendance'" (click)="EmployeeAttendance()">
          <span>Attendance</span>
        </button>
        <!-- <button type="button" class="nav-item nav-item--sub"
                [class.active]="active === 'emp-leaves'" (click)="EmployeeLeaves()">
          <span>Leaves</span>
        </button> -->
      </div>

      <button type="button" class="nav-item" [class.active]="active === 'manager'"
              [attr.aria-current]="active === 'manager' ? 'page' : null" (click)="Manager()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="8" r="3.5"/>
          <path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 5.5a3.5 3.5 0 0 1 0 6.5M18 14.3c2 .7 3.5 2.6 3.5 5.7"/>
        </svg>
        <span>Team</span>
      </button>
    </ng-container>

    <div class="side-nav__slot"><ng-content select="[sideNavCalendar]"></ng-content></div>
    <div class="side-nav__slot"><ng-content select="[sideNavHoliday]"></ng-content></div>
    <div class="side-nav__slot"><ng-content></ng-content></div>
  </nav>

  <!-- ===== Pinned bottom ===== -->
  <div class="side-nav__footer">
    <button type="button" class="nav-item" [class.active]="active === 'leave'"
            [attr.aria-current]="active === 'leave' ? 'page' : null" (click)="LogOut()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 3h5a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-5"/>
        <path d="M10 8l-4 4 4 4M6 12h10"/>
      </svg>
      <span>Leave</span>
    </button>
  </div>

</aside>
